[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "clipnado-studio-lite"
version = "0.1.0"
description = "Локальный отбор и экспорт непрерывных видеоэпизодов"
requires-python = ">=3.10,<3.14"
dependencies = ["PySide6==6.8.3", "httpx==0.28.1", "keyring==25.6.0"]

[project.optional-dependencies]
dev = ["pytest==8.3.5", "pyinstaller==6.12.0"]

[project.scripts]
clipnado = "clipnado.app:main"

[tool.setuptools.packages.find]
include = ["clipnado*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
