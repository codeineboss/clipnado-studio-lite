name: Build test and deliver Windows package
on:
  workflow_dispatch:
    inputs:
      validation_run:
        description: 'Optional passed-suite run, for packaging-script-only retries (application/tests/build inputs must match)'
        required: false
        type: string
        default: ''
permissions:
  contents: write
  actions: read
jobs:
  deliver:
    runs-on: windows-2022
    timeout-minutes: 240
    env:
      # The hosted Windows runner has no usable video decoder device.
      # Qt 6.8's documented empty hardware list keeps real playback on CPU.
      QT_FFMPEG_DECODING_HW_DEVICE_TYPES: ','
      CLIPNADO_DATA_DIR: '${{ github.workspace }}/.clipnado-test-data'
      CLIPNADO_TEST_WHISPER: '${{ github.workspace }}/tools/whisper-cli.exe'
      CLIPNADO_TEST_MODEL: '${{ github.workspace }}/models/ggml-base.bin'
      GH_TOKEN: '${{ github.token }}'
      CLIPNADO_TEST_LLAMA: '${{ github.workspace }}/tools/llama-cli.exe'
      CLIPNADO_TEST_QWEN: '${{ github.workspace }}/models/Qwen_Qwen3-4B-Instruct-2507-Q3_K_M.gguf'
      RELEASE_TAG: preview-0.1.17
      VALIDATION_RUN: ${{ inputs.validation_run }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          architecture: x64
      - name: Download verified FFmpeg and embedded Python
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force assets,tools | Out-Null
          # Official publisher's GitHub mirror; identical pinned bytes, with a website fallback.
          curl.exe --fail --location --retry 3 --retry-delay 5 --connect-timeout 30 --max-time 600 --output assets/ffmpeg-windows.zip https://github.com/GyanD/codexffmpeg/releases/download/8.1.2/ffmpeg-8.1.2-essentials_build.zip
          if ($LASTEXITCODE -ne 0) {
            curl.exe --fail --location --retry 3 --retry-delay 5 --connect-timeout 30 --max-time 600 --output assets/ffmpeg-windows.zip https://www.gyan.dev/ffmpeg/builds/packages/ffmpeg-8.1.2-essentials_build.zip
            if ($LASTEXITCODE -ne 0) { throw 'Both official FFmpeg download sources failed' }
          }
          if ((Get-FileHash assets/ffmpeg-windows.zip -Algorithm SHA256).Hash.ToLower() -ne 'db580001caa24ac104c8cb856cd113a87b0a443f7bdf47d8c12b1d740584a2ec') { throw 'FFmpeg checksum mismatch' }
          python -m zipfile -e assets/ffmpeg-windows.zip assets/ffmpeg
          Get-ChildItem assets/ffmpeg -Filter ffmpeg.exe -Recurse | Select-Object -First 1 | Copy-Item -Destination tools/ffmpeg.exe
          Get-ChildItem assets/ffmpeg -Filter ffprobe.exe -Recurse | Select-Object -First 1 | Copy-Item -Destination tools/ffprobe.exe
          (Resolve-Path tools).Path | Out-File -FilePath $env:GITHUB_PATH -Append
          Invoke-WebRequest https://www.python.org/ftp/python/3.13.9/python-3.13.9-embed-amd64.zip -OutFile assets/python-windows.zip -MaximumRetryCount 3 -RetryIntervalSec 5
      - name: Restore native local engines
        id: engines
        uses: actions/cache/restore@v4
        with:
          path: |
            tools/llama-cli.exe
            tools/vulkan
          key: windows-engines-014-${{ hashFiles('scripts/build_windows.ps1', 'scripts/build_local_models.ps1') }}
      - name: Build local speech engine and dependencies
        shell: pwsh
        run: ./scripts/build_windows.ps1 -SkipPackaging -SkipTests
      - name: Install exact portable dependencies for tests
        shell: pwsh
        run: |
          ./.venv/Scripts/python.exe -m pip install --require-hashes -r requirements-windows.lock
          if ($LASTEXITCODE -ne 0) { throw 'Locked dependencies failed' }
      - name: Check exports profiles audio cancellation and GUI before long inference
        env:
          QT_QPA_PLATFORM: offscreen
        shell: pwsh
        run: |
          ./.venv/Scripts/python.exe -m pytest tests/test_gaming.py tests/test_core.py tests/test_comfort.py tests/test_profiles.py tests/test_center_black.py tests/test_restored_selection.py tests/test_analysis_progress.py tests/test_gui.py -q -k "not actual_qwen"
          if ($LASTEXITCODE -ne 0) { throw 'Export and GUI preflight failed' }
      - name: Build CPU Qwen and verify GGUF
        timeout-minutes: 25
        shell: pwsh
        run: ./scripts/build_local_models.ps1 -Stage Cpu
      - name: Extract Vulkan SDK files without system runtime installation
        if: steps.engines.outputs.cache-hit != 'true'
        timeout-minutes: 12
        shell: pwsh
        run: ./scripts/build_local_models.ps1 -Stage Sdk
      - name: Build Vulkan Qwen
        if: steps.engines.outputs.cache-hit != 'true'
        timeout-minutes: 20
        shell: pwsh
        run: ./scripts/build_local_models.ps1 -Stage LlamaVulkan
      - name: Build Vulkan Whisper
        if: steps.engines.outputs.cache-hit != 'true'
        timeout-minutes: 20
        shell: pwsh
        run: ./scripts/build_local_models.ps1 -Stage WhisperVulkan
      - name: Save verified-build native engines before regression tests
        if: steps.engines.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            tools/llama-cli.exe
            tools/vulkan
          key: ${{ steps.engines.outputs.cache-primary-key }}
      - name: Build native launcher and collect dependencies
        shell: pwsh
        run: |
          cmake -S packaging -B build/launcher -G 'Visual Studio 17 2022' -A x64
          if ($LASTEXITCODE -ne 0) { throw 'Launcher configure failed' }
          cmake --build build/launcher --config Release
          if ($LASTEXITCODE -ne 0) { throw 'Launcher build failed' }
          Copy-Item build/launcher/Release/ClipnadoStudioLite.exe assets/ClipnadoStudioLite.exe
          Copy-Item tools/whisper-cli.exe assets/whisper-cli.exe
          Copy-Item tools/llama-cli.exe assets/llama-cli.exe
          Copy-Item tools/vulkan assets/vulkan -Recurse
          Copy-Item models/ggml-base.bin assets/ggml-base.bin
          python -m pip download --only-binary=:all: --require-hashes -r requirements-windows.lock --dest wheels
          if ($LASTEXITCODE -ne 0) { throw 'Wheel download failed' }
      - name: Assemble and test the actual portable runtime
        shell: pwsh
        run: |
          python scripts/package_portable.py --assets assets --wheels wheels --output build/portable
          if ($LASTEXITCODE -ne 0) { throw 'Packaging failed' }
          python scripts/verify_portable.py build/portable --semantic-model $env:CLIPNADO_TEST_QWEN
          if ($LASTEXITCODE -ne 0) { throw 'Portable runtime smoke failed' }
      - name: Check source identity for packaging retry
        if: inputs.validation_run != ''
        shell: pwsh
        run: |
          python scripts/reuse_windows_validation.py $env:VALIDATION_RUN
          if ($LASTEXITCODE -ne 0) { throw 'Full Windows suite required for changed application inputs' }
      - name: Download the passed full-suite report
        if: inputs.validation_run != ''
        uses: actions/download-artifact@v4
        with:
          name: windows-test-report
          run-id: ${{ inputs.validation_run }}
          github-token: ${{ github.token }}
          path: qa/previous-validation
      - name: Verify and restore the full-suite report
        if: inputs.validation_run != ''
        shell: pwsh
        run: |
          python scripts/reuse_windows_validation.py $env:VALIDATION_RUN --report qa/previous-validation/test-results-windows.xml
          if ($LASTEXITCODE -ne 0) { throw 'Source test report was invalid' }
      - name: Run regression suite with actual Whisper and Qwen inference
        if: inputs.validation_run == ''
        env:
          QT_QPA_PLATFORM: offscreen
        shell: pwsh
        run: |
          ./.venv/Scripts/python.exe -m pytest -x -q --junitxml=qa/test-results-windows.xml
          if ($LASTEXITCODE -ne 0) { throw 'Windows regression suite failed' }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-test-report
          path: qa/test-results-windows.xml
      - name: Package and upload release
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        run: |
          python scripts/finalize_windows_release.py build/portable output $env:CLIPNADO_TEST_QWEN
          if ($LASTEXITCODE -ne 0) { throw 'Final package failed' }
          $PSNativeCommandUseErrorActionPreference = $false
          gh release view $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --json tagName 2>$null | Out-Null
          if ($LASTEXITCODE -ne 0) {
            gh release create $env:RELEASE_TAG --draft --prerelease --target $env:GITHUB_SHA --title 'Clipnado Studio Lite 0.1.17 — поиск и границы из 0.1.15' --notes-file output/release-notes.md --repo $env:GITHUB_REPOSITORY
            if ($LASTEXITCODE -ne 0) { throw 'Release creation failed' }
          }
          gh release upload $env:RELEASE_TAG output/ClipnadoStudioLite-Windows-x64.zip output/ClipnadoStudioLite-source.zip output/START-HERE.md output/QA_REPORT.md output/SHA256SUMS.txt $env:CLIPNADO_TEST_QWEN --clobber --repo $env:GITHUB_REPOSITORY
          if ($LASTEXITCODE -ne 0) { throw 'Release upload failed' }
          gh release edit $env:RELEASE_TAG --draft=false --prerelease --target $env:GITHUB_SHA --notes-file output/release-notes.md --repo $env:GITHUB_REPOSITORY
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed' }
